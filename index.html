<!DOCTYPE html>
<html>
<head>
    <title>Breathing Compass Alert - Vibrate Calibration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        #score-box { font-size: 16px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: #fff;
            border: 5px solid #0275d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 90px;
            background: #d9534f;
            top: 10px;
            left: calc(50% - 3px);
            border-radius: 3px;
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
        }
        .center-dot {
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Focus Compass</h2>
    <div id="score-box">Mind Wandered Count: <span id="wanderCount">0</span> baar</div>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div class="compass-container">
        <div class="needle" id="needle"></div>
        <div class="center-dot"></div>
    </div>

    <div id="debug">Status: Waiting for start...</div>

    <script>
        let monitoring = false;
        let isCalibrating = false;
        let calibrationValues = [];
        
        let baseBeta = 0;
        let targetBeta = 0;
        let threshold70 = 0;

        let wanderCount = 0; 
        let lastMovementTime = Date.now();
        const thresholdTime = 6000; // 6 seconds limit

        function startSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        beginCalibration();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                beginCalibration();
            }
        }

        function beginCalibration() {
            isCalibrating = true;
            monitoring = false;
            calibrationValues = [];
            wanderCount = 0;
            document.getElementById("wanderCount").innerText = wanderCount;
            document.getElementById("status").style.color = "#d9534f";

            window.addEventListener('deviceorientation', handleOrientation);

            // 30 seconds ka countdown timer calibration ke liye
            let timeLeft = 30;
            let countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    document.getElementById("status").innerText = `Calibrating... Normal aur gehri saans lete rahein (${timeLeft}s remaining)`;
                    timeLeft--;
                } else {
                    clearInterval(countdownInterval);
                    if (calibrationValues.length > 0) {
                        baseBeta = Math.min(...calibrationValues);
                        targetBeta = Math.max(...calibrationValues);
                    } else {
                        baseBeta = 10;
                        targetBeta = 20;
                    }

                    let totalExpansion = targetBeta - baseBeta;
                    if (totalExpansion < 2) totalExpansion = 4; 
                    
                    threshold70 = baseBeta + (totalExpansion * 0.70);

                    isCalibrating = false;
                    monitoring = true;
                    lastMovementTime = Date.now();

                    // Calibration complete hone par phone vibrate karega
                    if ("vibrate" in navigator) {
                        navigator.vibrate(300);
                    }

                    document.getElementById("status").innerText = "Status: Calibration Done! Monitoring active.";
                    document.getElementById("status").style.color = "green";
                }
            }, 1000);
        }

        function handleOrientation(event) {
            let beta = event.beta ? event.beta : 0;
            let gamma = event.gamma ? event.gamma : 0;

            let rotationAngle = beta * 2;
            document.getElementById("needle").style.transform = `rotate(${rotationAngle}deg)`;

            if (isCalibrating) {
                calibrationValues.push(beta);
                let currentMin = Math.min(...calibrationValues);
                let currentMax = Math.max(...calibrationValues);
                document.getElementById("debug").innerHTML = `Calibrating (30s)... Min (Base): ${currentMin.toFixed(1)} | Max (Target): ${currentMax.toFixed(1)}`;
                return;
            }

            if (!monitoring) return;

            document.getElementById("debug").innerHTML = `Base (Min): ${baseBeta.toFixed(1)} | Target (Max): ${targetBeta.toFixed(1)} | 70%: ${threshold70.toFixed(1)} | Current: ${beta.toFixed(1)}`;

            if (beta >= threshold70) {
                lastMovementTime = Date.now();
                document.getElementById("status").innerText = "Status: Breathing detected... Good!";
                document.getElementById("status").style.color = "green";
            }
        }

        // Timer check alert & Score Increment
        setInterval(() => {
            if (!monitoring) return;
            let currentTime = Date.now();
            if ((currentTime - lastMovementTime) > thresholdTime) {
                wanderCount++; 
                document.getElementById("wanderCount").innerText = wanderCount;
                document.getElementById("status").innerText = "ALERT: Dhyan bhatak gaya! Saans par focus karein.";
                document.getElementById("status").style.color = "red";
                playBeep();
                lastMovementTime = currentTime; 
            }
        }, 1000);

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
