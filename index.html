<!DOCTYPE html>
<html>
<head>
    <title>Breathing Compass Alert - Strict 2-Count Frequency Rule</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        #score-box { font-size: 16px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: #fff;
            border: 5px solid #0275d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 90px;
            background: #d9534f;
            top: 10px;
            left: calc(50% - 3px);
            border-radius: 3px;
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
            z-index: 2;
        }
        .center-number {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 10px;
            z-index: 3;
            bottom: 50px;
        }
        .center-dot {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Focus Compass</h2>
    <div id="score-box">Mind Wandered Count: <span id="wanderCount">0</span> baar</div>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div class="compass-container">
        <div class="needle" id="needle"></div>
        <div class="center-number" id="centerNum">0.0</div>
        <div class="center-dot"></div>
    </div>

    <div id="debug">Status: Waiting for start...</div>

    <script>
        let monitoring = false;
        let isCalibrating = false;
        let calibrationValues = [];
        
        let baseBeta = 0;
        let targetBeta = 0;
        let threshold90 = 0;
        let lowLimit15 = 0;

        let wanderCount = 0; 
        let shallowCount = 0;   // 15% se niche jaakar upar aane ka count
        let wasBelow15 = false; // Track karega ki value pehle 15% se niche gayi thi ya nahi
        let lastZone = "none";  // "low", "middle", "high"

        function startSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        beginCalibration();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                beginCalibration();
            }
        }

        function beginCalibration() {
            isCalibrating = true;
            monitoring = false;
            calibrationValues = [];
            wanderCount = 0;
            shallowCount = 0;
            wasBelow15 = false;
            document.getElementById("wanderCount").innerText = wanderCount;
            document.getElementById("status").style.color = "#d9534f";

            window.addEventListener('deviceorientation', handleOrientation);

            let timeLeft = 30;
            let countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    document.getElementById("status").innerText = `Calibrating... Normal aur gehri saans lete rahein (${timeLeft}s remaining)`;
                    timeLeft--;
                } else {
                    clearInterval(countdownInterval);
                    if (calibrationValues.length > 0) {
                        baseBeta = Math.min(...calibrationValues);
                        targetBeta = Math.max(...calibrationValues);
                    } else {
                        baseBeta = 10;
                        targetBeta = 20;
                    }

                    let totalExpansion = targetBeta - baseBeta;
                    if (totalExpansion < 2) totalExpansion = 4; 
                    
                    threshold90 = baseBeta + (totalExpansion * 0.90);
                    lowLimit15 = baseBeta + (totalExpansion * 0.15);

                    isCalibrating = false;
                    monitoring = true;
                    wasBelow15 = false;
                    shallowCount = 0;

                    if ("vibrate" in navigator) {
                        navigator.vibrate(300);
                    }

                    document.getElementById("status").innerText = "Status: Calibration Done! Monitoring active.";
                    document.getElementById("status").style.color = "green";
                }
            }, 1000);
        }

        function handleOrientation(event) {
            let beta = event.beta ? event.beta : 0;
            let gamma = event.gamma ? event.gamma : 0;

            let rotationAngle = beta * 2;
            document.getElementById("needle").style.transform = `rotate(${rotationAngle}deg)`;
            document.getElementById("centerNum").innerText = beta.toFixed(1);

            if (isCalibrating) {
                calibrationValues.push(beta);
                let currentMin = Math.min(...calibrationValues);
                let currentMax = Math.max(...calibrationValues);
                document.getElementById("debug").innerHTML = `Calibrating (30s)... Min: ${currentMin.toFixed(1)} | Max: ${currentMax.toFixed(1)} | Current: ${beta.toFixed(1)}`;
                return;
            }

            if (!monitoring) return;

            document.getElementById("debug").innerHTML = `Base: ${baseBeta.toFixed(1)} | 15%: ${lowLimit15.toFixed(1)} | 90%: ${threshold90.toFixed(1)} | Shallow Count: <b>${shallowCount}</b>`;

            // 1. Low Zone (< 15%): Stillness / Breath Retention
            if (beta < lowLimit15) {
                wasBelow15 = true; // Mark kar liya ki value 15% se niche gayi thi
                lastZone = "low";
                document.getElementById("status").innerText = "Status: Deep Stillness / Retention (<15%)";
                document.getElementById("status").style.color = "purple";
            } 
            // 2. High Zone (>= 90%): Deep Breath -> Good! Reset counts.
            else if (beta >= threshold90) {
                wasBelow15 = false;
                shallowCount = 0; // Gehri saans lene par count reset ho jayega
                lastZone = "high";
                document.getElementById("status").innerText = "Status: Deep Breath Detected... Good! (>=90%)";
                document.getElementById("status").style.color = "green";
            } 
            // 3. Middle Zone (15% se upar AUR 90% se kam): Danger / Shallow Zone
            else {
                // Agar value pehle <15% thi aur ab middle zone mein aayi hai, matlab ek shallow cycle poori hui
                if (wasBelow15 && lastZone !== "middle") {
                    shallowCount++; // Count 1 se badh gaya
                    wasBelow15 = false; // Flag reset agli cycle ke liye
                }
                lastZone = "middle";

                // AGAR 2 SE ZYADA BAR SHALLOW BREATHING HO GAYI HAI (Yani 3 ya usse zyada baar)
                if (shallowCount > 2) {
                    wanderCount++;
                    document.getElementById("wanderCount").innerText = wanderCount;
                    document.getElementById("status").innerText = "ALERT: 2 baar se zyada shallow breathing! Dhyan de.";
                    document.getElementById("status").style.color = "red";
                    playBeep();
                    
                    // Logic reset taaki agli baar fir se count zero se shuru ho sake
                    shallowCount = 0; 
                } else {
                    document.getElementById("status").innerText = `Status: Shallow Breathing (Count: ${shallowCount}/2)`;
                    document.getElementById("status").style.color = "orange";
                }
            }
        }

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
