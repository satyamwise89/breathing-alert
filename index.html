<!DOCTYPE html>
<html>
<head>
    <title>Breathing Vertical Motion Bar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        #score-box { font-size: 16px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        
        /* Compass ki jagah ek Vertical Line / Bar Container */
        .vertical-container {
            position: relative;
            width: 40px;
            height: 220px;
            margin: 20px auto;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        /* Yeh bar upar niche move karega saans ke sath */
        .vertical-bar {
            width: 100%;
            height: 0%;
            background: #0275d8;
            border-radius: 0 0 20px 20px;
            transition: height 0.05s ease-out;
        }
        /* Center number bar ke upar ya niche live dikhega */
        #centerNum {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Vertical Motion Meter</h2>
    <div id="score-box">Mind Wandered Count: <span id="wanderCount">0</span> baar</div>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <!-- Vertical Line / Meter Container -->
    <div class="vertical-container">
        <div class="vertical-bar" id="vertBar"></div>
    </div>
    <div id="centerNum">Value: 0.00</div>

    <div id="debug">Status: Waiting for start...</div>

    <script>
        let monitoring = false;
        let isCalibrating = false;
        let calibrationValues = [];
        
        let baseVal = 0;
        let targetVal = 0;
        let threshold90 = 0;
        let lowLimit15 = 0;

        let wanderCount = 0; 
        let shallowCount = 0;   
        let wasBelow15 = false; 
        let lastZone = "none";  

        function startSensor() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        beginCalibration();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                beginCalibration();
            }
        }

        function beginCalibration() {
            isCalibrating = true;
            monitoring = false;
            calibrationValues = [];
            wanderCount = 0;
            shallowCount = 0;
            wasBelow15 = false;
            document.getElementById("wanderCount").innerText = wanderCount;
            document.getElementById("status").style.color = "#d9534f";

            // Pure linear acceleration bina gravity ke (sirf real up/down movement ke liye)
            window.addEventListener('devicemotion', handleMotion);

            let timeLeft = 30;
            let countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    document.getElementById("status").innerText = `Calibrating... Pet par flat rakh kar saans lein (${timeLeft}s remaining)`;
                    timeLeft--;
                } else {
                    clearInterval(countdownInterval);
                    if (calibrationValues.length > 0) {
                        baseVal = Math.min(...calibrationValues);
                        targetVal = Math.max(...calibrationValues);
                    } else {
                        baseVal = 0.0;
                        targetVal = 0.5;
                    }

                    let totalExpansion = targetVal - baseVal;
                    if (totalExpansion < 0.05) totalExpansion = 0.2; // Safety fallback
                    
                    threshold90 = baseVal + (totalExpansion * 0.90);
                    lowLimit15 = baseVal + (totalExpansion * 0.15);

                    isCalibrating = false;
                    monitoring = true;
                    wasBelow15 = false;
                    shallowCount = 0;

                    if ("vibrate" in navigator) {
                        navigator.vibrate(300);
                    }

                    document.getElementById("status").innerText = "Status: Calibration Done! Monitoring active.";
                    document.getElementById("status").style.color = "green";
                }
            }, 1000);
        }

        function handleMotion(event) {
            // event.acceleration (bina gravity ke) seedha physical movement (push up/down) maapta hai
            let accelZ = event.acceleration ? event.acceleration.z : 0;
            if (accelZ === null) accelZ = 0;

            // Agar value negative bhi aaye toh magnitude ya absolute le sakte hain ya seedha track kar sakte hain
            let currentMove = Math.abs(accelZ);

            // Vertical Bar ko animate karne ke liye percentage calculate karein (0 se 100%)
            let barHeight = Math.min(Math.max((currentMove / 1.5) * 100, 0), 100);
            document.getElementById("vertBar").style.height = barHeight + "%";
            document.getElementById("centerNum").innerText = "Movement: " + currentMove.toFixed(2);

            if (isCalibrating) {
                calibrationValues.push(currentMove);
                let currentMin = Math.min(...calibrationValues);
                let currentMax = Math.max(...calibrationValues);
                document.getElementById("debug").innerHTML = `Calibrating (30s)... Min: ${currentMin.toFixed(2)} | Max: ${currentMax.toFixed(2)}`;
                return;
            }

            if (!monitoring) return;

            document.getElementById("debug").innerHTML = `Base: ${baseVal.toFixed(2)} | 15%: ${lowLimit15.toFixed(2)} | 90%: ${threshold90.toFixed(2)} | Shallow Count: <b>${shallowCount}</b>`;

            // 1. Low Zone (< 15% expansion / Stillness)
            if (currentMove < lowLimit15) {
                wasBelow15 = true; 
                lastZone = "low";
                document.getElementById("status").innerText = "Status: Deep Stillness / Retention (<15%)";
                document.getElementById("status").style.color = "purple";
            } 
            // 2. High Zone (>= 90% expansion / Deep Breath) -> Smart Reset
            else if (currentMove >= threshold90) {
                wasBelow15 = false;
                shallowCount = 0; 
                lastZone = "high";
                document.getElementById("status").innerText = "Status: Deep Breath Detected... Good! (>=90%)";
                document.getElementById("status").style.color = "green";
            } 
            // 3. Middle Zone (15% - 90% danger zone)
            else {
                if (wasBelow15 && lastZone !== "middle") {
                    shallowCount++; 
                    wasBelow15 = false; 
                }
                lastZone = "middle";

                if (shallowCount > 2) {
                    wanderCount++;
                    document.getElementById("wanderCount").innerText = wanderCount;
                    document.getElementById("status").innerText = "ALERT: 2 baar se zyada shallow breathing! Dhyan de.";
                    document.getElementById("status").style.color = "red";
                    playBeep();
                    
                    shallowCount = 0; 
                } else {
                    document.getElementById("status").innerText = `Status: Shallow Breathing (Count: ${shallowCount}/2)`;
                    document.getElementById("status").style.color = "orange";
                }
            }
        }

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
