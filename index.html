<!DOCTYPE html>
<html>
<head>
    <title>Breathing Compass Alert - Auto Calibrated</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            background: #fff;
            border: 5px solid #0275d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 90px;
            background: #d9534f;
            top: 10px;
            left: calc(50% - 3px);
            border-radius: 3px;
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
        }
        .center-dot {
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Focus Compass</h2>
    <div id="status">Status: Click 'Start' to begin calibration</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div class="compass-container">
        <div class="needle" id="needle"></div>
        <div class="center-dot"></div>
    </div>

    <div id="debug">Status: Waiting for start...</div>

    <script>
        let monitoring = false;
        let isCalibrating = false;
        let baseBeta = 0;             // Normal state value (e.g., 10-11)
        let calibrationReadings = [];
        let lastMovementTime = Date.now();
        const thresholdTime = 6000;   // 6 seconds ka gap limit
        let hasExpanded = false;

        function startSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        beginCalibration();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                beginCalibration();
            }
        }

        function beginCalibration() {
            isCalibrating = true;
            monitoring = false;
            calibrationReadings = [];
            document.getElementById("status").innerText = "Calibrating... Relax and breathe normally (3 sec)";
            document.getElementById("status").style.color = "#d9534f";

            // Listeners on karo calibration ke liye data collect karne ko
            window.addEventListener('deviceorientation', handleOrientation);
        }

        function handleOrientation(event) {
            let beta = event.beta ? event.beta : 0;
            let gamma = event.gamma ? event.gamma : 0;

            // Needle rotation
            let rotationAngle = beta * 2;
            document.getElementById("needle").style.transform = `rotate(${rotationAngle}deg)`;

            if (isCalibrating) {
                calibrationReadings.push(beta);
                document.getElementById("debug").innerHTML = `Calibrating... Current Beta: ${beta.toFixed(2)}`;
                
                // 3 second tak readings collect karke average base value nikal lenge
                if (calibrationReadings.length === 30) { // ~3 seconds at standard event rate
                    let sum = calibrationReadings.reduce((a, b) => a + b, 0);
                    baseBeta = sum / calibrationReadings.length;
                    isCalibrating = false;
                    monitoring = true;
                    lastMovementTime = Date.now();
                    
                    document.getElementById("status").innerText = "Status: Calibration Done! Monitoring active.";
                    document.getElementById("status").style.color = "green";
                }
                return;
            }

            if (!monitoring) return;

            // Target Expansion calculate karo (Aapke mutabik 10-11 se badhkar 20-21 yaani ~10 point ka difference aata hai)
            let currentExpansion = beta - baseBeta; // Kitna pet phula base se
            let requiredExpansion = 4.0;            // 70% expansion ki limit (approx 4-5 unit jump)

            document.getElementById("debug.innerHTML = `Base: ${baseBeta.toFixed(1)} | Beta: ${beta.toFixed(1)} | Diff: ${currentExpansion.toFixed(1)}`;

            // Agar saans lene par expansion limit (70% ya usse upar) cross hota hai
            if (currentExpansion >= requiredExpansion) {
                lastMovementTime = Date.now();
                document.getElementById("status").innerText = "Status: Breathing detected... Good!";
                document.getElementById("status").style.color = "green";
            }
        }

        // Timer check alert ke liye (6 second tak agar pet nahi phula toh beep)
        setInterval(() => {
            if (!monitoring) return;
            let currentTime = Date.now();
            if ((currentTime - lastMovementTime) > thresholdTime) {
                document.getElementById("status").innerText = "ALERT: Dhyan bhatak gaya! Saans par focus karein.";
                document.getElementById("status").style.color = "red";
                playBeep();
                lastMovementTime = currentTime; // Reset timer
            }
        }, 1000);

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
