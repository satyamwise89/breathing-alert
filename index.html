<!DOCTYPE html>
<html>
<head>
    <title>Breathing Compass Alert - 90% Strict Rule</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        #score-box { font-size: 16px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: #fff;
            border: 5px solid #0275d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 90px;
            background: #d9534f;
            top: 10px;
            left: calc(50% - 3px);
            border-radius: 3px;
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
            z-index: 2;
        }
        /* Compass ke andar tiny live number */
        .center-number {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 10px;
            z-index: 3;
            bottom: 50px;
        }
        .center-dot {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Focus Compass</h2>
    <div id="score-box">Mind Wandered Count: <span id="wanderCount">0</span> baar</div>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div class="compass-container">
        <div class="needle" id="needle"></div>
        <div class="center-number" id="centerNum">0.0</div>
        <div class="center-dot"></div>
    </div>

    <!-- Neeche Current Value aur Details -->
    <div id="debug">Status: Waiting for start...</div>

    <script>
        let monitoring = false;
        let isCalibrating = false;
        let calibrationValues = [];
        
        let baseBeta = 0;
        let targetBeta = 0;
        let threshold90 = 0;
        let lowLimit15 = 0;

        let wanderCount = 0; 
        let lastValidBreathTime = Date.now();
        const thresholdTime = 6000; // 6 seconds limit

        function startSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        beginCalibration();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                beginCalibration();
            }
        }

        function beginCalibration() {
            isCalibrating = true;
            monitoring = false;
            calibrationValues = [];
            wanderCount = 0;
            document.getElementById("wanderCount").innerText = wanderCount;
            document.getElementById("status").style.color = "#d9534f";

            window.addEventListener('deviceorientation', handleOrientation);

            let timeLeft = 30;
            let countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    document.getElementById("status").innerText = `Calibrating... Normal aur gehri saans lete rahein (${timeLeft}s remaining)`;
                    timeLeft--;
                } else {
                    clearInterval(countdownInterval);
                    if (calibrationValues.length > 0) {
                        baseBeta = Math.min(...calibrationValues);
                        targetBeta = Math.max(...calibrationValues);
                    } else {
                        baseBeta = 10;
                        targetBeta = 20;
                    }

                    let totalExpansion = targetBeta - baseBeta;
                    if (totalExpansion < 2) totalExpansion = 4; 
                    
                    // 90% threshold aur 15% lower movement limit
                    threshold90 = baseBeta + (totalExpansion * 0.90);
                    lowLimit15 = baseBeta + (totalExpansion * 0.15);

                    isCalibrating = false;
                    monitoring = true;
                    lastValidBreathTime = Date.now();

                    if ("vibrate" in navigator) {
                        navigator.vibrate(300);
                    }

                    document.getElementById("status").innerText = "Status: Calibration Done! Monitoring active.";
                    document.getElementById("status").style.color = "green";
                }
            }, 1000);
        }

        function handleOrientation(event) {
            let beta = event.beta ? event.beta : 0;
            let gamma = event.gamma ? event.gamma : 0;

            let rotationAngle = beta * 2;
            document.getElementById("needle").style.transform = `rotate(${rotationAngle}deg)`;
            
            // Compass ke andar tiny live number show karein
            document.getElementById("centerNum").innerText = beta.toFixed(1);

            if (isCalibrating) {
                calibrationValues.push(beta);
                let currentMin = Math.min(...calibrationValues);
                let currentMax = Math.max(...calibrationValues);
                document.getElementById("debug").innerHTML = `Calibrating (30s)... Min: ${currentMin.toFixed(1)} | Max: ${currentMax.toFixed(1)} | Current: ${beta.toFixed(1)}`;
                return;
            }

            if (!monitoring) return;

            // Neeche current value aur limits show karein
            document.getElementById("debug").innerHTML = `Base: ${baseBeta.toFixed(1)} | 90% Limit: ${threshold90.toFixed(1)} | Current Value: <b>${beta.toFixed(1)}</b>`;

            // Condition A: Achi gehri saans (>= 90% threshold) -> Good! Timer reset, No beep.
            if (beta >= threshold90) {
                lastValidBreathTime = Date.now();
                document.getElementById("status").innerText = "Status: Deep Breath Detected... Good!";
                document.getElementById("status").style.color = "green";
            } 
            // Condition B: Bilkul sthir ya stillness (< 15% expansion) -> Deep Meditation / Retention. Timer reset, No beep.
            else if (beta < lowLimit15) {
                lastValidBreathTime = Date.now();
                document.getElementById("status").innerText = "Status: Deep Stillness / Breath Retention...";
                document.getElementById("status").style.color = "purple";
            } 
            // Condition C: Sirf tabhi jab value 15% se upar ho aur 90% se kam ho (Shallow/Wandering Breathing) -> Timer chalne do, 6s baad beep bajegi!
            else {
                document.getElementById("status").innerText = "Status: Shallow Breathing / Wandering...";
                document.getElementById("status").style.color = "orange";
            }
        }

        // Timer check alert & Score Increment
        setInterval(() => {
            if (!monitoring) return;
            let currentTime = Date.now();
            if ((currentTime - lastValidBreathTime) > thresholdTime) {
                wanderCount++; 
                document.getElementById("wanderCount").innerText = wanderCount;
                document.getElementById("status").innerText = "ALERT: Dhyan bhatak gaya! Saans par focus karein.";
                document.getElementById("status").style.color = "red";
                playBeep();
                lastValidBreathTime = currentTime; 
            }
        }, 1000);

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
