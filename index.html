<!DOCTYPE html>
<html>
<head>
    <title>Breathing Alert System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Focus Monitor</h2>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div id="debug">Sensor Debug: Not Started</div>

    <script>
        let lastMovementTime = Date.now();
        const thresholdTime = 5000; // 5 seconds
        let monitoring = false;

        function startSensor() {
            // Permission for mobile browsers
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        initListener();
                    } else {
                        alert("Sensor permission denied!");
                    }
                }).catch(console.error);
            } else {
                initListener();
            }
        }

        function initListener() {
            monitoring = true;
            lastMovementTime = Date.now();
            document.getElementById("statusinnerText" = "Status: Monitoring active. Pet par phone rakhein.");
            
            window.addEventListener('devicemotion', (event) => {
                if (!monitoring) return;
                
                let acc = event.accelerationIncludingGravity;
                if (!acc) return;

                let x = acc.x ? acc.x.toFixed(2) : 0;
                let y = acc.y ? acc.y.toFixed(2) : 0;
                let z = acc.z ? acc.z.toFixed(2) : 0;

                // Screen par live values dikhane ke liye
                document.getElementById("debug").innerHTML = `X: ${x} | Y: ${y} | Z: ${z}`;

                // Agar kisi bhi axis par movement ho (motion sensitivity kam karke 0.2 kar di hai)
                if (Math.abs(acc.z) > 0.3 || Math.abs(acc.y) > 0.3) {
                    lastMovementTime = Date.now();
                    document.getElementById("status").innerText = "Status: Breathing detected... Good!";
                    document.getElementById("status").style.color = "green";
                }
            });

            // Timer check
            setInterval(() => {
                if (!monitoring) return;
                let currentTime = Date.now();
                if ((currentTime - lastMovementTime) > thresholdTime) {
                    document.getElementById("status").innerText = "ALERT: Dhyan bhatak gaya! Saans par focus karein.";
                    document.getElementById("status").style.color = "red";
                    playBeep();
                    lastMovementTime = currentTime; 
                }
            }, 1000);
        }

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
