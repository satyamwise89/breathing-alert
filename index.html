<!DOCTYPE html>
<html>
<head>
    <title>Breathing Motion Alert - Up/Down Movement</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        #score-box { font-size: 16px; font-weight: bold; color: #d9534f; margin-bottom: 15px; }
        
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 20px auto;
            background: #fff;
            border: 5px solid #0275d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 90px;
            background: #d9534f;
            top: 10px;
            left: calc(50% - 3px);
            border-radius: 3px;
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
            z-index: 2;
        }
        .center-number {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 10px;
            z-index: 3;
            bottom: 50px;
        }
        .center-dot {
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Motion Compass</h2>
    <div id="score-box">Mind Wandered Count: <span id="wanderCount">0</span> baar</div>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div class="compass-container">
        <div class="needle" id="needle"></div>
        <div class="center-number" id="centerNum">0.0</div>
        <div class="center-dot"></div>
    </div>

    <div id="debug">Status: Waiting for start...</div>

    <script>
        let monitoring = false;
        let isCalibrating = false;
        let calibrationValues = [];
        
        let baseVal = 0;
        let targetVal = 0;
        let threshold90 = 0;
        let lowLimit15 = 0;

        let wanderCount = 0; 
        let shallowCount = 0;   
        let wasBelow15 = false; 
        let lastZone = "none";  

        function startSensor() {
            // iOS aur modern browsers ke liye DeviceMotion permission check
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        beginCalibration();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                beginCalibration();
            }
        }

        function beginCalibration() {
            isCalibrating = true;
            monitoring = false;
            calibrationValues = [];
            wanderCount = 0;
            shallowCount = 0;
            wasBelow15 = false;
            document.getElementById("wanderCount").innerText = wanderCount;
            document.getElementById("status").style.color = "#d9534f";

            // DeviceMotion listener for Z-axis upward/downward movement
            window.addEventListener('devicemotion', handleMotion);

            let timeLeft = 30;
            let countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    document.getElementById("status").innerText = `Calibrating... Pet par flat rakh kar normal aur gehri saans lein (${timeLeft}s remaining)`;
                    timeLeft--;
                } else {
                    clearInterval(countdownInterval);
                    if (calibrationValues.length > 0) {
                        baseVal = Math.min(...calibrationValues);
                        targetVal = Math.max(...calibrationValues);
                    } else {
                        baseVal = 9.8;
                        targetVal = 10.5;
                    }

                    let totalExpansion = targetVal - baseVal;
                    if (totalExpansion < 0.1) totalExpansion = 0.5; // Safety fallback
                    
                    threshold90 = baseVal + (totalExpansion * 0.90);
                    lowLimit15 = baseVal + (totalExpansion * 0.15);

                    isCalibrating = false;
                    monitoring = true;
                    wasBelow15 = false;
                    shallowCount = 0;

                    if ("vibrate" in navigator) {
                        navigator.vibrate(300);
                    }

                    document.getElementById("status").innerText = "Status: Calibration Done! Monitoring active.";
                    document.getElementById("status").style.color = "green";
                }
            }, 1000);
        }

        function handleMotion(event) {
            // Z-axis acceleration (pet ke upar-neeche hone par gravity ke sath value badalti/ghatati hai)
            let zAxis = event.accelerationIncludingGravity ? event.accelerationIncludingGravity.z : 0;
            if (zAxis === null) zAxis = 0;

            // Needle rotation visual feedback ke liye (zAxis ko scale karke)
            let rotationAngle = (zAxis - 9.8) * 30; 
            document.getElementById("needle").style.transform = `rotate(${rotationAngle}deg)`;
            document.getElementById("centerNum").innerText = zAxis.toFixed(2);

            if (isCalibrating) {
                calibrationValues.push(zAxis);
                let currentMin = Math.min(...calibrationValues);
                let currentMax = Math.max(...calibrationValues);
                document.getElementById("debug").innerHTML = `Calibrating (30s)... Min: ${currentMin.toFixed(2)} | Max: ${currentMax.toFixed(2)} | Current: ${zAxis.toFixed(2)}`;
                return;
            }

            if (!monitoring) return;

            document.getElementById("debug").innerHTML = `Base: ${baseVal.toFixed(2)} | 15%: ${lowLimit15.toFixed(2)} | 90%: ${threshold90.toFixed(2)} | Shallow Count: <b>${shallowCount}</b>`;

            // 1. Low Zone (< 15% expansion / Stillness)
            if (zAxis < lowLimit15) {
                wasBelow15 = true; 
                lastZone = "low";
                document.getElementById("status").innerText = "Status: Deep Stillness / Retention (<15%)";
                document.getElementById("status").style.color = "purple";
            } 
            // 2. High Zone (>= 90% expansion / Deep Breath) -> Smart Reset
            else if (zAxis >= threshold90) {
                wasBelow15 = false;
                shallowCount = 0; 
                lastZone = "high";
                document.getElementById("status").innerText = "Status: Deep Breath Detected... Good! (>=90%)";
                document.getElementById("status").style.color = "green";
            } 
            // 3. Middle Zone (15% - 90% danger zone)
            else {
                if (wasBelow15 && lastZone !== "middle") {
                    shallowCount++; 
                    wasBelow15 = false; 
                }
                lastZone = "middle";

                // Agar lagataar 2 baar shallow breathing ho gayi hai toh beep bajegi
                if (shallowCount > 2) {
                    wanderCount++;
                    document.getElementById("wanderCount").innerText = wanderCount;
                    document.getElementById("status").innerText = "ALERT: 2 baar se zyada shallow breathing! Dhyan de.";
                    document.getElementById("status").style.color = "red";
                    playBeep();
                    
                    shallowCount = 0; 
                } else {
                    document.getElementById("status").innerText = `Status: Shallow Breathing (Count: ${shallowCount}/2)`;
                    document.getElementById("status").style.color = "orange";
                }
            }
        }

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
