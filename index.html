<!DOCTYPE html>
<html>
<head>
    <title>Breathing Compass Alert</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        h2 { color: #333; }
        #status { font-size: 18px; font-weight: bold; margin: 15px 0; color: #333; }
        
        .compass-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 30px auto;
            background: #fff;
            border: 5px solid #0275d8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .needle {
            position: absolute;
            width: 6px;
            height: 90px;
            background: #d9534f;
            top: 10px;
            left: calc(50% - 3px);
            border-radius: 3px;
            transform-origin: bottom center;
            transition: transform 0.1s ease-out;
        }
        .center-dot {
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            z-index: 2;
        }

        #debug { font-size: 14px; color: #555; background: #fff; padding: 10px; border-radius: 5px; margin-top: 15px; border: 1px solid #ccc; }
        button { padding: 12px 24px; font-size: 16px; background: #0275d8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Breathing Focus Compass</h2>
    <div id="status">Status: Click 'Start' to begin</div>
    <button onclick="startSensor()">Start Monitoring</button>

    <div class="compass-container">
        <div class="needle" id="needle"></div>
        <div class="center-dot"></div>
    </div>

    <div id="debug">Compass Debug: Waiting...</div>

    <script>
        let lastMovementTime = Date.now();
        const thresholdTime = 6000; // 6 seconds ka gap
        let monitoring = false;
        let lastBeta = 0;

        function startSensor() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(response => {
                    if (response === 'granted') {
                        initListener();
                    } else {
                        alert("Permission denied!");
                    }
                }).catch(console.error);
            } else {
                initListener();
            }
        }

        function initListener() {
            monitoring = true;
            lastMovementTime = Date.now();
            document.getElementById("status").innerText = "Status: Monitoring active. Pet par phone rakhein.";
            
            window.addEventListener('deviceorientation', (event) => {
                if (!monitoring) return;

                let beta = event.beta ? event.beta : 0; 
                let gamma = event.gamma ? event.gamma : 0;   

                let rotationAngle = beta * 2; 
                document.getElementById("needle").style.transform = `rotate(${rotationAngle}deg)`;

                document.getElementById("debug.innerHTML = `Beta: ${beta.toFixed(2)} | Diff: ${Math.abs(beta - lastBeta).toFixed(2)}`;

                // Yahan hum check kar rahe hain ki pichli value se thoda bhi badlav (movement) hua ya nahi
                let difference = Math.abs(beta - lastBeta);
                if (difference > 0.15) { // Pet ke utaar-chadhaw par yeh change detect hoga
                    lastMovementTime = Date.now();
                    document.getElementById("status").innerText = "Status: Breathing detected... Good!";
                    document.getElementById("status").style.color = "green";
                }
                lastBeta = beta;
            });

            // Har 1 second mein check karega ki 6 second se zyada time toh nahi ho gaya bina saans ke
            setInterval(() => {
                if (!monitoring) return;
                let currentTime = Date.now();
                if ((currentTime - lastMovementTime) > thresholdTime) {
                    document.getElementById("status").innerText = "ALERT: Dhyan bhatak gaya! Saans par focus karein.";
                    document.getElementById("status").style.color = "red";
                    playBeep();
                    lastMovementTime = currentTime; // Reset timer taaki lagataar beep na baje
                }
            }, 1000);
        }

        function playBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio error: ", e);
            }
        }
    </script>
</body>
</html>
